# Production stack on the server (/opt/onvioo). The panel image is built by the
# deploy workflow and loaded on the server, so the server never builds or needs npm.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: onvioo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: onvioo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onvioo"]
      interval: 5s
      retries: 10

  migrate:
    image: onvioo-panel:latest
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://onvioo:${POSTGRES_PASSWORD}@db:5432/onvioo
    working_dir: /tools
    command: ["node", "node_modules/tsx/dist/cli.mjs", "scripts/migrate.mts"]

  app:
    image: onvioo-panel:latest
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: postgres://onvioo:${POSTGRES_PASSWORD}@db:5432/onvioo
    # Only reachable from the server itself (Caddy and the cron jobs)
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # Empty DOMAIN serves plain HTTP on the IP; with a domain Caddy gets an HTTPS certificate itself
      SITE_ADDRESS: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
